<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Claude Fact Guard</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="header">
      <h1>Claude Fact Guard</h1>
      <label class="switch" title="Enable / disable verification">
        <input type="checkbox" id="enabled-toggle" />
        <span class="slider"></span>
      </label>
    </header>

    <section class="status">
      <div class="status-row">
        <span class="status-dot" id="status-dot"></span>
        <span class="status-label" id="status-label">— Not checked</span>
      </div>
      <p class="status-error" id="status-error" hidden></p>
    </section>

    <section class="settings">
      <label class="field">
        <span>Gemini API key</span>
        <input
          type="password"
          id="api-key"
          placeholder="AIza..."
          autocomplete="off"
          spellcheck="false"
        />
      </label>
      <button class="primary" id="save-key">Save key</button>
      <p class="hint">
        Stored in <code>chrome.storage.sync</code>. Used only to call
        <a
          href="https://generativelanguage.googleapis.com"
          target="_blank"
          rel="noreferrer noopener"
          >generativelanguage.googleapis.com</a
        >.
      </p>
    </section>

    <section class="stats">
      <h2>This session</h2>
      <ul>
        <li><span>Verified</span><strong id="stat-verifications">0</strong></li>
        <li><span>Corrections</span><strong id="stat-corrections">0</strong></li>
        <li><span>Skipped</span><strong id="stat-skipped">0</strong></li>
        <li><span>Errors</span><strong id="stat-errors">0</strong></li>
      </ul>
      <button class="secondary" id="reset-stats">Reset session counters</button>
    </section>

    <footer>
      <a
        href="https://github.com/nbjiragale/claude-fact-guard"
        target="_blank"
        rel="noreferrer noopener"
        >GitHub</a
      >
      ·
      <span id="version-label"></span>
    </footer>

    <script src="popup.js"></script>
  </body>
</html>
